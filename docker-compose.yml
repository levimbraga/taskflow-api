# Orquestração local completa da stack TaskFlow.
#
# Sobe a aplicação em duas réplicas atrás de um proxy reverso nginx, com a
# pilha de observabilidade (métricas via Prometheus/Grafana e logs via
# Loki/Promtail). Use:  docker compose up -d
#
# Portas expostas no host:
#   80   -> nginx (aplicação)
#   3000 -> Grafana
#   9090 -> Prometheus

name: taskflow

services:
  app:
    image: ${TASKFLOW_IMAGE:-ghcr.io/levimbraga/taskflow-api:latest}
    build: .
    restart: unless-stopped
    expose:
      - "8000"
    deploy:
      replicas: 2
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    # Endurecimento do contêiner: sem escalonamento de privilégios, sistema de
    # arquivos raiz somente leitura e todas as capabilities do kernel removidas.
    security_opt:
      - no-new-privileges:true
    read_only: true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - frontend
      - observability

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - ./ops/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - frontend

  prometheus:
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    security_opt:
      - no-new-privileges:true
    networks:
      - observability

  loki:
    image: grafana/loki:3.3.2
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./ops/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    security_opt:
      - no-new-privileges:true
    networks:
      - observability

  promtail:
    image: grafana/promtail:3.3.2
    restart: unless-stopped
    depends_on:
      - loki
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./ops/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    security_opt:
      - no-new-privileges:true
    networks:
      - observability

  grafana:
    image: grafana/grafana:11.5.1
    restart: unless-stopped
    depends_on:
      - prometheus
      - loki
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    security_opt:
      - no-new-privileges:true
    networks:
      - observability

  # Deploy pull-based: monitora o GHCR e recria o contêiner da aplicação
  # automaticamente quando uma nova imagem :latest é publicada pelo pipeline.
  watchtower:
    image: containrrr/watchtower:1.7.1
    restart: unless-stopped
    profiles: ["deploy"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 60 --cleanup --scope taskflow --include-restarting
    environment:
      WATCHTOWER_ROLLING_RESTART: "true"
    networks:
      - observability

networks:
  frontend:
  observability:

volumes:
  prometheus-data:
  loki-data:
  grafana-data:
