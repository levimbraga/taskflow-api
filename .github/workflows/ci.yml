name: CI

# O pipeline roda em todo push para main/develop e em toda abertura de Pull
# Request, garantindo que nenhum código chegue à branch principal sem passar
# pelas etapas de qualidade.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PYTHON_DEFAULT: "3.14"
  IMAGE_NAME: ghcr.io/${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  # ---------------------------------------------------------------------------
  # Etapa 1 - Análise estática. É a mais rápida, então roda primeiro e falha
  # cedo, evitando gastar minutos de runner com código mal formatado.
  # ---------------------------------------------------------------------------
  lint:
    name: Lint e formatação
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}
          cache: pip

      - name: Instalar dependências de desenvolvimento
        run: pip install -r requirements-dev.txt

      - name: Executar script de lint
        run: ./scripts/lint.sh

  # ---------------------------------------------------------------------------
  # Etapa 2 - Testes automatizados em matriz de versões do Python, com
  # cobertura mínima de 90% imposta pelo pytest (--cov-fail-under).
  # ---------------------------------------------------------------------------
  test:
    name: Testes (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar dependências de desenvolvimento
        run: pip install -r requirements-dev.txt

      - name: Executar script de testes
        run: ./scripts/test.sh

      - name: Publicar relatório de cobertura como artefato
        if: matrix.python-version == '3.14'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Etapa 3 - Validação da infraestrutura como código. Roda em paralelo com os
  # testes porque não depende deles.
  # ---------------------------------------------------------------------------
  terraform-validate:
    name: Validação do Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.3"

      - name: Verificar formatação dos arquivos .tf
        run: terraform fmt -check -recursive
        working-directory: infra

      # -backend=false permite validar a sintaxe sem credenciais da AWS, que
      # no Learner Lab expiram a cada sessão e não podem ficar em segredos fixos.
      - name: Inicializar sem backend
        run: terraform init -backend=false
        working-directory: infra

      - name: Validar configuração
        run: terraform validate
        working-directory: infra

  # ---------------------------------------------------------------------------
  # Etapa 4 - Build da imagem de contêiner e teste de fumaça. Só publica no
  # GitHub Container Registry quando o commit chega na branch main.
  # ---------------------------------------------------------------------------
  build:
    name: Build da imagem e teste de fumaça
    runs-on: ubuntu-latest
    needs: [test, terraform-validate]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Construir imagem e validar health check
        run: ./scripts/build.sh taskflow-api:${{ github.sha }}

      - name: Autenticar no GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar imagem com as tags sha e latest
        if: github.ref == 'refs/heads/main'
        run: |
          IMAGE=$(echo "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')
          docker tag taskflow-api:${{ github.sha }} "${IMAGE}:${{ github.sha }}"
          docker tag taskflow-api:${{ github.sha }} "${IMAGE}:latest"
          docker push "${IMAGE}:${{ github.sha }}"
          docker push "${IMAGE}:latest"
