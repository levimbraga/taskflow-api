name: CD

# ------------------------------------------------------------------------------
# Pipeline de Entrega Contínua — modelo *pull-based*.
#
# Por que não empurrar o deploy daqui?
#
# O projeto roda no AWS Academy Learner Lab, cujas credenciais são de sessão:
# expiram a cada "Start Lab" e trazem um AWS_SESSION_TOKEN novo. Não existe
# credencial estável para guardar em `secrets` do GitHub, e as permissões do
# laboratório também não permitem criar a IAM role que o OIDC exigiria. Um
# pipeline que fizesse `aws ssm send-command` ou abrisse SSH para o runner
# quebraria a cada nova sessão do laboratório.
#
# A alternativa adotada inverte o sentido do fluxo: o pipeline apenas *promove*
# a imagem no GitHub Container Registry, e quem puxa a novidade é a própria
# instância EC2, através do Watchtower, que observa a tag :latest e recria o
# contêiner sozinho. As vantagens são concretas:
#
#   - nenhuma credencial da AWS precisa existir no GitHub;
#   - a porta 22 permanece fechada, sem faixa de IP de runner liberada no
#     security group;
#   - a instância só faz conexões de saída, o que sobrevive a IP dinâmico e a
#     recriações da infraestrutura;
#   - o "estado desejado" é a tag do registro, e não um comando imperativo que
#     pode falhar pela metade.
#
# O preço é a latência: o Watchtower verifica o registro a cada 60 segundos,
# então há uma janela de até um minuto entre a aprovação e o contêiner novo no
# ar. Para o escopo desta disciplina é uma troca vantajosa.
# ------------------------------------------------------------------------------

on:
  # Só dispara depois que o CI inteiro (lint, testes, Terraform, segurança e
  # build) terminou com sucesso. O filtro de branch é reforçado dentro do job,
  # porque `workflow_run` também dispara para outras branches.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Permite promover manualmente um commit já validado, por exemplo para
  # refazer um deploy depois de uma indisponibilidade da instância.
  workflow_dispatch:
    inputs:
      motivo:
        description: Motivo da promoção manual
        required: false
        default: Promoção manual solicitada pelo mantenedor

env:
  REGISTRO: ghcr.io
  IMAGEM: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  # ----------------------------------------------------------------------------
  # Etapa 1 — Promoção da imagem.
  #
  # O `environment: producao` é o portão de aprovação manual: com "Required
  # reviewers" configurado nas Settings do repositório, o job fica parado
  # aguardando aprovação humana antes de tocar no registro.
  # ----------------------------------------------------------------------------
  promover:
    name: Promover imagem para produção
    runs-on: ubuntu-latest
    # `workflow_run` dispara mesmo quando o CI falha; este filtro garante que só
    # um CI verde na main chega até aqui. O `workflow_dispatch` passa direto.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    environment:
      name: producao
      url: ${{ steps.versao.outputs.url_pacote }}
    outputs:
      tag: ${{ steps.versao.outputs.tag }}
      imagem: ${{ steps.versao.outputs.imagem }}
      sha: ${{ steps.versao.outputs.sha }}
    steps:
      # O commit promovido é o que o CI validou, e não necessariamente a ponta
      # da main: entre o fim do CI e a aprovação manual podem ter entrado
      # outros commits que ainda não passaram pelo pipeline.
      - name: Identificar o commit validado pelo CI
        id: alvo
        run: |
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.alvo.outputs.sha }}

      - name: Montar a tag de versão
        id: versao
        run: |
          set -euo pipefail
          SHA_LONGO="${{ steps.alvo.outputs.sha }}"
          SHA_CURTO="${SHA_LONGO:0:7}"
          DATA=$(date -u +'%Y.%m.%d')
          # Formato: 2026.09.06-a1b2c3d — ordenável por data e rastreável até o
          # commit exato que originou a imagem.
          TAG="${DATA}-${SHA_CURTO}"
          IMAGEM=$(echo "${REGISTRO}/${IMAGEM}" | tr '[:upper:]' '[:lower:]')

          {
            echo "sha=${SHA_LONGO}"
            echo "tag=${TAG}"
            echo "imagem=${IMAGEM}"
            echo "url_pacote=https://github.com/${GITHUB_REPOSITORY}/pkgs/container/${GITHUB_REPOSITORY##*/}"
          } >> "$GITHUB_OUTPUT"

          echo "Promovendo ${IMAGEM}:${SHA_LONGO} para ${TAG} e latest"

      - name: Autenticar no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRO }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A imagem NÃO é reconstruída: promover é apenas apontar novas tags para o
      # mesmo digest que o CI construiu e testou. Reconstruir aqui poderia gerar
      # um binário diferente do que passou pelos testes e pelas varreduras.
      - name: Promover o digest validado para :latest e para a tag de versão
        run: |
          set -euo pipefail
          ORIGEM="${{ steps.versao.outputs.imagem }}:${{ steps.versao.outputs.sha }}"
          echo ">> Imagem de origem: ${ORIGEM}"

          if ! docker buildx imagetools inspect "${ORIGEM}" > /dev/null 2>&1; then
            echo "!! Não existe imagem publicada para o commit ${{ steps.versao.outputs.sha }}." >&2
            echo "!! Só é possível promover um commit cujo job 'build' do CI tenha rodado na main." >&2
            exit 1
          fi

          docker buildx imagetools create \
            --tag "${{ steps.versao.outputs.imagem }}:${{ steps.versao.outputs.tag }}" \
            --tag "${{ steps.versao.outputs.imagem }}:latest" \
            "${ORIGEM}"

      - name: Registrar a promoção no resumo da execução
        run: |
          {
            echo "## Imagem promovida"
            echo
            echo "| Campo | Valor |"
            echo "|---|---|"
            echo "| Commit | \`${{ steps.versao.outputs.sha }}\` |"
            echo "| Tag de versão | \`${{ steps.versao.outputs.tag }}\` |"
            echo "| Tag móvel | \`latest\` |"
            echo "| Registro | \`${{ steps.versao.outputs.imagem }}\` |"
            echo
            echo "O Watchtower na instância EC2 verifica o registro a cada 60 s"
            echo "e recria o contêiner da aplicação assim que detectar o novo digest."
          } >> "$GITHUB_STEP_SUMMARY"

  # ----------------------------------------------------------------------------
  # Etapa 2 — Verificação da promoção.
  #
  # Confirma que as duas tags existem no registro e apontam para o mesmo digest
  # do commit validado. É o que separa "o comando de push não deu erro" de "a
  # imagem que a instância vai baixar é realmente a certa".
  # ----------------------------------------------------------------------------
  verificar:
    name: Verificar a imagem no registro
    runs-on: ubuntu-latest
    needs: promover
    permissions:
      contents: read
      packages: read
    steps:
      - name: Autenticar no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRO }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ------------------------------------------------------------------------
      # Por que a comparação é feita em nível de PLATAFORMA, e não pelo digest da
      # referência inteira?
      #
      # O CI publica a tag do commit como um manifesto único. O passo de promoção
      # usa `docker buildx imagetools create`, que ENVELOPA esse manifesto único
      # em um índice OCI e aponta as novas tags para o índice. O digest de um
      # índice é o hash do índice, e por definição nunca é igual ao digest do
      # manifesto que ele contém — mesmo sendo exatamente a mesma imagem.
      #
      # Comparar `:latest` com `:<sha>` no nível da referência, portanto, compara
      # duas coisas que jamais poderiam coincidir, e a verificação reprovava uma
      # promoção correta. O que de fato identifica a imagem é o digest do
      # manifesto `linux/amd64`, derivado do conteúdo das camadas: ele não muda
      # ao reetiquetar nem ao embrulhar o manifesto em um índice.
      #
      # A consulta é feita direto na API do registro, e não por
      # `docker buildx imagetools`, porque assim o digest vem do próprio GHCR,
      # sem depender de reserialização local do manifesto.
      #
      # A propagação no registro não é instantânea; a espera com novas tentativas
      # evita um falso negativo logo após o push. A espera vale APENAS para o caso
      # de "ainda não disponível": uma divergência real de digest reprova na hora,
      # sem gastar dez tentativas.
      - name: Aguardar a propagação e conferir os digests de plataforma
        run: |
          set -euo pipefail
          IMAGEM="${{ needs.promover.outputs.imagem }}"
          TAG="${{ needs.promover.outputs.tag }}"
          SHA="${{ needs.promover.outputs.sha }}"
          # "ghcr.io/dono/projeto" -> "dono/projeto", o escopo aceito pela API.
          REPOSITORIO="${IMAGEM#*/}"
          PLATAFORMA="linux/amd64"

          # As funções abaixo devolvem o resultado em variáveis globais, e não pela
          # saída padrão: `valor=$(funcao)` roda a função em um subshell, e o
          # motivo do erro registrado lá dentro se perderia no retorno — foi assim
          # que a versão anterior conseguiu tratar "não encontrei" como se fosse
          # uma comparação bem-sucedida entre dois valores vazios.
          TOKEN=""
          DIGEST_RESOLVIDO=""
          MOTIVO=""

          obter_token() {
            local resposta
            TOKEN=""
            MOTIVO=""
            # Sem `2>/dev/null` e sem `|| true`: silenciar o erro foi o que fazia
            # uma consulta malsucedida ser relatada como digest divergente.
            if ! resposta=$(curl -sS --fail-with-body \
              "https://ghcr.io/token?scope=repository:${REPOSITORIO}:pull" 2>&1); then
              MOTIVO="consulta falhou: não foi possível obter o token de pull (${resposta})"
              return 1
            fi
            TOKEN=$(printf '%s' "${resposta}" | jq -r '.token // empty')
            if [[ -z "${TOKEN}" ]]; then
              MOTIVO="consulta falhou: o registro não devolveu um token de pull"
              return 1
            fi
          }

          # Resolve o digest do manifesto linux/amd64 da referência recebida e o
          # deixa em DIGEST_RESOLVIDO. Em caso de erro devolve 1 e descreve a causa
          # em MOTIVO, distinguindo "consulta falhou" de "digest ausente".
          digest_plataforma() {
            local referencia="$1"
            local cabecalhos corpo status digest
            DIGEST_RESOLVIDO=""
            MOTIVO=""

            cabecalhos=$(mktemp)
            corpo=$(mktemp)

            # Os quatro Accept cobrem as duas famílias de mídia (OCI e Docker v2)
            # nas duas formas (índice/lista e manifesto único). Sem eles o registro
            # pode devolver uma conversão em outro formato.
            if ! status=$(curl -sS -o "${corpo}" -D "${cabecalhos}" -w '%{http_code}' \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Accept: application/vnd.oci.image.index.v1+json" \
              -H "Accept: application/vnd.docker.distribution.manifest.list.v2+json" \
              -H "Accept: application/vnd.oci.image.manifest.v1+json" \
              -H "Accept: application/vnd.docker.distribution.manifest.v2+json" \
              "https://ghcr.io/v2/${REPOSITORIO}/manifests/${referencia}"); then
              MOTIVO="consulta falhou: erro de rede ao consultar ${IMAGEM}:${referencia}"
              rm -f "${cabecalhos}" "${corpo}"
              return 1
            fi

            if [[ "${status}" != "200" ]]; then
              MOTIVO="consulta falhou: o registro respondeu HTTP ${status} para ${IMAGEM}:${referencia}"
              rm -f "${cabecalhos}" "${corpo}"
              return 1
            fi

            if jq -e 'has("manifests")' "${corpo}" > /dev/null 2>&1; then
              # Índice OCI ou lista de manifestos: o digest que interessa é o da
              # entrada da plataforma, não o do índice que a embrulha.
              digest=$(jq -r --arg so "${PLATAFORMA%/*}" --arg arq "${PLATAFORMA#*/}" '
                .manifests[]
                | select(.platform.os == $so and .platform.architecture == $arq)
                | .digest' "${corpo}" | head -n 1)
            else
              # Manifesto único: o próprio registro informa o digest no cabeçalho.
              digest=$(grep -i '^docker-content-digest:' "${cabecalhos}" \
                | tail -n 1 | tr -d '\r' | awk '{print $2}')
            fi

            rm -f "${cabecalhos}" "${corpo}"

            if [[ -z "${digest}" || "${digest}" == "null" ]]; then
              MOTIVO="digest ausente: ${IMAGEM}:${referencia} respondeu, mas não traz manifesto ${PLATAFORMA}"
              return 1
            fi

            DIGEST_RESOLVIDO="${digest}"
          }

          TENTATIVAS=10
          ESPERA=15

          for tentativa in $(seq 1 "${TENTATIVAS}"); do
            INDISPONIVEL=""
            DIGEST_VERSAO=""
            DIGEST_LATEST=""
            DIGEST_COMMIT=""

            if ! obter_token; then
              INDISPONIVEL="${MOTIVO}"
            else
              for par in "DIGEST_VERSAO:${TAG}" "DIGEST_LATEST:latest" "DIGEST_COMMIT:${SHA}"; do
                variavel="${par%%:*}"
                referencia="${par#*:}"
                if digest_plataforma "${referencia}"; then
                  printf -v "${variavel}" '%s' "${DIGEST_RESOLVIDO}"
                else
                  INDISPONIVEL="${MOTIVO}"
                  break
                fi
              done
            fi

            # Guarda explícita: nenhuma referência pode chegar vazia à comparação,
            # sob pena de dois vazios "coincidirem" e aprovarem uma promoção que
            # nunca foi conferida.
            if [[ -z "${INDISPONIVEL}" ]] &&
               [[ -z "${DIGEST_VERSAO}" || -z "${DIGEST_LATEST}" || -z "${DIGEST_COMMIT}" ]]; then
              INDISPONIVEL="digest ausente: alguma referência ficou sem digest ${PLATAFORMA}"
            fi

            # Casos 1 e 2 — consulta falhou ou digest ausente. Os dois ainda podem
            # ser propagação em andamento, então valem nova tentativa.
            if [[ -n "${INDISPONIVEL}" ]]; then
              echo ">> Tentativa ${tentativa}/${TENTATIVAS}: ${INDISPONIVEL}"
              if (( tentativa < TENTATIVAS )); then
                echo ">> Aguardando ${ESPERA} s antes de tentar de novo"
                sleep "${ESPERA}"
                continue
              fi
              echo "!! A imagem promovida não ficou acessível no registro após ${TENTATIVAS} tentativas" >&2
              echo "!! Última causa: ${INDISPONIVEL}" >&2
              exit 1
            fi

            echo ">> Digests de plataforma (${PLATAFORMA}) resolvidos pelo registro:"
            echo ">>   ${IMAGEM}:${TAG} -> ${DIGEST_VERSAO}"
            echo ">>   ${IMAGEM}:latest -> ${DIGEST_LATEST}"
            echo ">>   ${IMAGEM}:${SHA} -> ${DIGEST_COMMIT}"

            # Caso 3 — as três referências responderam, mas apontam para camadas
            # diferentes. Isso é defeito de verdade: reprova imediatamente, sem
            # gastar as tentativas restantes esperando por algo que não vai mudar.
            if [[ "${DIGEST_VERSAO}" != "${DIGEST_LATEST}" || "${DIGEST_VERSAO}" != "${DIGEST_COMMIT}" ]]; then
              echo "!! Digests divergentes: as três referências existem no registro," >&2
              echo "!! mas não apontam para o mesmo manifesto ${PLATAFORMA}." >&2
              echo "!! A imagem que a instância baixaria não é a validada pelo CI." >&2
              exit 1
            fi

            echo ">> As três referências apontam para o mesmo manifesto ${PLATAFORMA}"

            {
              echo "## Verificação concluída"
              echo
              echo "| Referência | Digest de plataforma (\`${PLATAFORMA}\`) |"
              echo "|---|---|"
              echo "| \`${TAG}\` | \`${DIGEST_VERSAO}\` |"
              echo "| \`latest\` | \`${DIGEST_LATEST}\` |"
              echo "| \`${SHA}\` | \`${DIGEST_COMMIT}\` |"
              echo
              echo "As tags promovidas são um índice OCI que aponta para o mesmo manifesto"
              echo "\`${PLATAFORMA}\` validado pelo CI: por isso a conferência compara o digest"
              echo "de plataforma \`${DIGEST_VERSAO}\`, e não o digest do índice, que muda a cada"
              echo "reetiquetagem."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          done
