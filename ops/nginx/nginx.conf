# Proxy reverso e balanceador de carga entre as réplicas da aplicação.
#
# Nota técnica: um bloco "upstream" estático faria o nginx resolver o nome
# "app" uma única vez, na inicialização, fixando o tráfego em uma só réplica.
# Para que o balanceamento funcione de fato é preciso apontar o resolver
# interno do Docker (127.0.0.11) e usar uma variável no proxy_pass, o que
# força a reresolução do DNS e distribui as requisições entre as réplicas.

limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # Cabeçalhos de segurança
    add_header X-Content-Type-Options  "nosniff"     always;
    add_header X-Frame-Options         "DENY"        always;
    add_header Referrer-Policy         "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'" always;
    server_tokens off;

    client_max_body_size 1m;

    # Sem esta linha o nginx responderia 503 ao cortar uma rajada, o que sugere
    # indisponibilidade do servidor. 429 informa corretamente ao cliente que ele
    # excedeu o limite e pode tentar de novo.
    limit_req_status 429;

    location / {
        limit_req zone=api burst=20 nodelay;

        set $backend "app:8000";
        proxy_pass http://$backend;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # O Prometheus descobre as réplicas por DNS e raspa app:8000/metrics
    # diretamente pela rede interna "observability" — nunca através do nginx.
    # Como não há consumidor legítimo desta rota do lado de fora, o proxy a
    # recusa por completo. Uma lista de permissão por faixa privada não
    # resolveria: o tráfego que chega da rede do Docker é traduzido para o
    # endereço do gateway da bridge, que cai justamente dentro dessas faixas.
    location /metrics {
        deny all;
    }
}
